openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0
  description: API documentation for Contacts project
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://nodejs-hw-mongodb-hrgw.onrender.com
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/contactId/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/contactId/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/contactId/delete.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
